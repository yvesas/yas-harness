name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: workflows only need to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create config/models.json
        # A deployment's own file, not in Git -- so a clean checkout has only
        # the example. This is what start.sh does on a real machine, and doing
        # it here means CI runs on the same config a first-time user gets.
        run: cp config/models.example.json config/models.json

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: License headers
        run: npm run license:check

      - name: Architecture boundaries
        run: npm run boundaries

      - name: Tenant isolation
        # Reads the migrations: every table holding user data carries tenant_id,
        # cascades from tenants, and names the tenant in any key that reaches
        # another table. The next table is what regresses, not the current ones.
        run: npm run isolation

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Console
        # `next build` type-checks as it compiles, so this is the console's
        # typecheck and its build in one step. It runs here because the console
        # is part of the product now: a change to a harness port that breaks the
        # page reading it should fail this pull request, not the next person to
        # open the console.
        run: npm run console:build

      - name: Package
        # Packs, installs into a throwaway project and imports by name. The one
        # thing the test suite cannot catch: every test imports src/ by relative
        # path, so a broken exports map or a missing file only fails on the
        # first consumer.
        run: npm run package:check

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://harness:harness@localhost:5432/harness
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create config/models.json
        # A deployment's own file, not in Git -- so a clean checkout has only
        # the example. This is what start.sh does on a real machine, and doing
        # it here means CI runs on the same config a first-time user gets.
        run: cp config/models.example.json config/models.json

      # A migration that cannot be rolled back is a migration we cannot ship.
      - name: Apply
        run: node scripts/migrate.mjs up

      - name: Roll back
        run: node scripts/migrate.mjs down

      - name: Re-apply
        run: node scripts/migrate.mjs up

      # Tenant isolation is a schema guarantee, so it is proven against the
      # schema. These tests skip when DATABASE_URL is unset.
      - name: Integration tests
        run: npm test

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Built on every change and pushed on none. The release workflow is the
      # only thing that publishes, and it only runs on a tag — so without this
      # step a broken Dockerfile would stay broken until release day. Single
      # architecture here: this is checking the build, not shipping it.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: yas-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A library image whose entrypoint cannot start is not worth publishing.
      # An unknown command is the one path that proves the image without a
      # database: node runs, the script is present, `pg` resolved (it is a
      # top-level import, so a missing dependency crashes before this line),
      # and the entrypoint dispatched. A missing module would say so instead.
      - name: Smoke-test the entrypoint
        run: |
          output=$(docker run --rm yas-harness:ci bogus 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'unknown command' || {
            echo '::error::the image entrypoint did not start'
            exit 1
          }

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The commit-msg hook can be bypassed locally; this cannot.
      - name: Validate commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          status=0
          for sha in $(git rev-list "$base".."$head"); do
            # Bot commits are generated, not authored: Dependabot's subject
            # names every package it bumped and routinely exceeds our length
            # rule, which it has no way to satisfy. What lands on main is the
            # squash title, and a maintainer writes that.
            author=$(git log -1 --format=%an "$sha")
            case "$author" in
              'dependabot[bot]' | 'github-actions[bot]') continue ;;
            esac

            git log -1 --format=%B "$sha" > /tmp/commit-msg
            if ! .githooks/commit-msg /tmp/commit-msg; then
              echo "::error::invalid commit message in $sha"
              status=1
            fi
          done
          exit $status
